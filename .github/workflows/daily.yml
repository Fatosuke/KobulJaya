name: Sinyal Saham Harian

on:
  schedule:
    - cron: "0 2,6,9 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Jalankan pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/scheduler.py

      - name: Commit hasil digest
        run: |
          git config user.name "sinyal-saham-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/output/daily_digest.json || true
          git diff --cached --quiet || git commit -m "Update digest $(date -u +%F_%H:%M)"
          git push || true
