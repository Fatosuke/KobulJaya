name: Riset Mingguan Investasi Jangka Panjang

on:
  schedule:
    # Setiap Senin jam 09:00 WIB (02:00 UTC)
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

jobs:
  run-longterm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Jalankan riset jangka panjang
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/longterm_agent.py

      - name: Commit hasil
        run: |
          git config user.name "sinyal-saham-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/output/longterm_digest.json || true
          git diff --cached --quiet || git commit -m "Update riset jangka panjang $(date -u +%F)"
          git push || true
