name: Sinyal Saham Harian

on:
  schedule:
    # Jam WIB (UTC+7): 09:00, 13:00, 16:00 -> UTC: 02:00, 06:00, 09:00
    # Hari kerja saja (1-5 = Senin-Jumat). Hari libur non-weekend tetap
    # di-skip otomatis oleh backend/market_hours.py (config.IDX_HOLIDAYS).
    - cron: "0 2,6,9 * * 1-5"
  workflow_dispatch: {}   # bisa dijalankan manual dari tab Actions di GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Jalankan pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backend/scheduler.py

      # Simpan hasil digest supaya bisa dibaca app/PWA (opsional: push ke branch
      # terpisah, atau upload ke storage seperti Firebase/S3 kalau mau lebih rapi)
      - name: Commit hasil digest
        run: |
          git config user.name "sinyal-saham-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/output/daily_digest.json || true
          git diff --cached --quiet || git commit -m "Update digest $(date -u +%F_%H:%M)"
          git push || true
